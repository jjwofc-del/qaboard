<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="QABoard - QA test and bug management demo" />
  <title>QABoard · QA Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css?v=0.3.2?v=0.3.0?v=0.2.1" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">Q</div><div><strong>QABoard</strong><small>QUALITY WORKSPACE</small></div></div>
      <div class="workspace"><span class="workspace-dot"></span><span>Demo Workspace</span><span class="chevron">⌄</span></div>
      <div class="nav-label">WORKSPACE</div>
      <nav id="navigation">
        <button class="nav-item active" data-page="dashboard"><span>▦</span> Dashboard</button>
        <button class="nav-item" data-page="projects"><span>◫</span> Projects <b>3</b></button>
        <button class="nav-item" data-page="cases"><span>☷</span> Test Cases <b>24</b></button>
        <button class="nav-item" data-page="runs"><span>▷</span> Test Runs</button>
        <button class="nav-item" data-page="bugs"><span>⚑</span> Bug Management <b class="bug-count">5</b></button>
      </nav>
      <div class="nav-label reports-label">INSIGHTS</div>
      <button class="nav-item" data-page="reports"><span>▥</span> Reports</button>
      <div class="sidebar-bottom"><div class="demo-card"><div class="demo-icon">✦</div><strong>Demo environment</strong><p>샘플 데이터로 안전하게 둘러보세요. 개인정보는 저장하지 않습니다.</p><span class="demo-pill">SAMPLE DATA ONLY</span></div><div class="profile"><div class="avatar">QA</div><div><strong>QA Tester 01</strong><small>Demo account</small></div><span class="more">···</span></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="crumb">Dashboard</strong></div><div class="top-actions"><span class="demo-tag"><i></i> Demo mode</span><button class="icon-button" aria-label="알림">♧</button><div class="avatar small">QA</div></div></header>
      <section class="page-wrap">
        <div id="page-content"></div>
      </section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="src/app.js?v=0.5.0"></script>
</body>
</html>
