<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="QABoard - QA test and bug management demo" />
  <title>QABoard · QA Workspace</title>
  <link rel="stylesheet" href="src/styles.css?v=0.8.0" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">Q</div><div><strong>QABoard</strong><small>QUALITY WORKSPACE</small></div></div>
      <div class="workspace"><span class="workspace-dot"></span><span>Demo Workspace</span><span class="chevron">⌄</span></div>
      <div class="nav-label">WORKSPACE</div>
      <nav id="navigation">
        <button class="nav-item active" data-page="dashboard"><span>▦</span> Dashboard</button>
        <button class="nav-item" data-page="projects"><span>◫</span> Projects <b id="nav-project-count">3</b></button>
        <button class="nav-item" data-page="cases"><span>☷</span> Test Cases <b id="nav-case-count">5</b></button>
        <button class="nav-item" data-page="runs"><span>▷</span> Test Runs</button>
        <button class="nav-item" data-page="workshop"><span>✎</span> TC 작성 연습</button>
        <button class="nav-item" data-page="bugs"><span>⚑</span> Bug Management <b class="bug-count" id="nav-bug-count">5</b></button>
      </nav>
      <div class="nav-label reports-label">INSIGHTS</div>
      <button class="nav-item" data-page="reports"><span>▥</span> Reports</button>
      <div class="nav-label reports-label">DATA & PRIVACY</div>
      <button class="nav-item" data-page="settings"><span>⚙</span> Settings & Backup</button>
      <div class="sidebar-bottom"><div class="demo-card"><div class="demo-icon">✦</div><strong>Demo environment</strong><p>실제 개인정보를 입력하지 마세요. 입력 내용은 이 브라우저에 저장됩니다.</p><span class="demo-pill">SAMPLE DATA ONLY</span></div><div class="profile"><div class="avatar">QA</div><div><strong>QA Tester 01</strong><small>Demo account</small></div><span class="more">···</span></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="crumb">Dashboard</strong></div><div class="top-actions"><span class="demo-tag"><i></i> Demo mode</span><button class="icon-button" aria-label="알림">♧</button><div class="avatar small">QA</div></div></header>
      <section class="page-wrap">
        <div id="page-content"></div>
      </section>
    </main>
  </div>
  <input type="file" id="backup-file" accept=".json,application/json" hidden aria-label="QABoard 백업 파일 선택" />
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="src/app.js?v=0.8.0"></script>
</body>
</html>
